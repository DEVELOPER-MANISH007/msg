name = "ephemeral-chat"
main = "src/index.ts"
compatibility_date = "2026-10-28"
workers_dev = true

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[vars]
ROOM_TTL_SECONDS = "21600"
MAX_SIGNALING_PER_MINUTE = "60"

[triggers]
crons = ["*/10 * * * *"]
